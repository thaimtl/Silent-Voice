name: Pylint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pylint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - run: pip install pylint==4.1.3
    # Errors only: the GPU and hardware dependencies are not installed here, so import-error is off.
    - run: pylint --errors-only --disable=import-error $(git ls-files '*.py')
